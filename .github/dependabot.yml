version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # typescript-eslint does not support TypeScript 6.1+ yet (peer range <6.1.0). Revisit when it does.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
